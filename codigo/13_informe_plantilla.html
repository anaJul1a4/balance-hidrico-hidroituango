}

<script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.27.0/plotly.min.js"></script>
<script>
const D = %%DATA%%;
const MESES = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
const v = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const CFG = { responsive: true, displaylogo: false, displayModeBar: false, scrollZoom: false, doubleClick: false };
/* Gráficas «estáticas»: sin zoom, arrastre, botones ni leyendas que oculten series; sólo los valores al pasar el cursor. */
const _react = Plotly.react.bind(Plotly);
Plotly.react = function (el, tr, L, cfg) {
  (tr || []).forEach(t => { if (t.visible === false || t.visible === "legendonly") t.visible = true; });
  L = L || {}; delete L.updatemenus; L.dragmode = false;
  ["xaxis", "yaxis"].concat(Object.keys(L).filter(k => /^[xy]axis\d+$/.test(k))).forEach(k => {   // sólo ejes existentes
    L[k] = Object.assign({}, L[k] || {}, { fixedrange: true });
    if (L[k].rangeslider) L[k].rangeslider = { visible: false };
    delete L[k].rangeselector;
  });
  L.legend = Object.assign({}, L.legend || {}, { itemclick: false, itemdoubleclick: false });
  return _react(el, tr, L, Object.assign({}, cfg || {}, CFG));
};

function ax(t, extra) {
  return Object.assign({ title: { text: t, font: { size: 11, color: v("--muted") } }, gridcolor: v("--grid"), linecolor: v("--axis"),
    zeroline: false, tickfont: { size: 10, color: v("--muted") }, automargin: true }, extra || {});
}
function lay(extra) {
  return Object.assign({ paper_bgcolor: "rgba(0,0,0,0)", plot_bgcolor: "rgba(0,0,0,0)",
    font: { family: v("--f-body"), color: v("--ink"), size: 11 }, margin: { l: 50, r: 12, t: 12, b: 40 },
    hoverlabel: { bgcolor: v("--bg"), bordercolor: v("--hair"), font: { color: v("--ink"), size: 12 } },
    legend: { orientation: "h", x: 0, y: 1.02, yanchor: "bottom", font: { size: 11 } }, showlegend: false }, extra || {});
}

const PLOTS = {
  /* ---------- series y dispersión ---------- */
  s_perfil(el) {
    Plotly.react(el, [{ type: "scatter", mode: "lines", x: D.perfil.d, y: D.perfil.z, line: { color: v("--accent"), width: 2 },
      fill: "tozeroy", fillcolor: "rgba(11,104,114,.08)", hovertemplate: "%{x:,.0f} km desde el nacimiento · %{y:,.0f} m<extra></extra>" }],
      lay({ xaxis: ax("Distancia desde el nacimiento (km)"), yaxis: ax("Elevación (m s.n.m.)", { rangemode: "tozero" }) }), CFG);
  },
  s_vario(el) {
    const o = D.vario, hh = Array.from({ length: 101 }, (_, i) => i);
    const g = h => o.c0 + o.c * (1 - Math.exp(-3 * (h / o.a) ** 2));
    Plotly.react(el, [
      { type: "scatter", mode: "markers", x: o.h, y: o.g, customdata: o.n, name: "Experimental",
        marker: { size: 9, color: v("--accent"), line: { color: v("--bg"), width: 2 } },
        hovertemplate: "%{x:.0f} km · γ = %{y:,.0f} mm² · %{customdata} pares<extra></extra>" },
      { type: "scatter", mode: "lines", x: hh, y: hh.map(g), name: "Modelo gaussiano", line: { color: v("--ink"), width: 1.5 }, hoverinfo: "skip" }],
      lay({ showlegend: true, xaxis: ax("Distancia entre estaciones (km)"), yaxis: ax("Semivarianza γ (mm²)", { rangemode: "tozero" }) }), CFG);
  },
  tz(el, k, col) {
    const t = D.tz, [t0, a, r2] = t.coef[k], zz = [0, 4500];
    Plotly.react(el, [
      { type: "scatter", mode: "markers", x: t.Z, y: t[k], customdata: t.n.map((n, i) => [n, t.m[i]]),
        marker: { size: 8, color: v(col), line: { color: v("--bg"), width: 1.5 } },
        hovertemplate: "<b>%{customdata[0]}</b> (%{customdata[1]})<br>%{x:,.0f} m · %{y:.1f} °C<extra></extra>" },
      { type: "scatter", mode: "lines", x: zz, y: zz.map(z => t0 - a * z), line: { color: v("--ink"), width: 1.3 }, hoverinfo: "skip" }],
      lay({ margin: { l: 46, r: 10, t: 34, b: 40 }, xaxis: ax("Elevación Z (m)", { range: [0, 4500] }), yaxis: ax(`${k} (°C)`, { range: [0, 36] }),
        annotations: [{ xref: "paper", yref: "paper", x: 0, y: 1.02, xanchor: "left", yanchor: "bottom", showarrow: false, align: "left",
          text: `<b>${k}</b> = ${t0.toFixed(2)} − ${a.toFixed(5)}·Z   α = ${(a * 1000).toFixed(2)} °C/km   R² = ${r2.toFixed(3)}   n = ${t.Z.length}`,
          font: { size: 11, color: v("--ink") } }] }), CFG);
  },
  s_tmax(el) { PLOTS.tz(el, "Tmax", "--s1"); }, s_tmed(el) { PLOTS.tz(el, "Tmed", "--s2"); }, s_tmin(el) { PLOTS.tz(el, "Tmin", "--s3"); },
  s_etpm(el) {
    Plotly.react(el, [{ type: "bar", x: MESES, y: D.etpm, marker: { color: v("--accent") }, hovertemplate: "%{x}: %{y:.0f} mm<extra></extra>" }],
      lay({ bargap: .4, xaxis: ax(""), yaxis: ax("ETP (mm/mes)", { rangemode: "tozero" }) }), CFG);
  },
  s_Q(el) {
    const s = D.serie, nombres = Object.keys(s.q), def = "Pto. Valdivia";
    const pal = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#4a3aa7", "#e34948", "#7f8c8d", "#0b6872"];
    const tr = nombres.map((n, i) => ({ type: "scatter", mode: "lines", name: n, x: s.t, y: s.q[n], connectgaps: false,
      visible: n === def || n === "La Virginia" ? true : "legendonly", line: { width: 1.4, color: pal[i % pal.length] },
      hovertemplate: `${n}: %{y:,.0f} m³/s<extra></extra>` }));
    Plotly.react(el, tr, lay({ showlegend: true, hovermode: "x unified", margin: { l: 56, r: 12, t: 40, b: 30 },
      legend: { orientation: "h", x: 0, y: 1.02, yanchor: "bottom", font: { size: 10 } },
      xaxis: ax("", { type: "date", rangeslider: { visible: true, thickness: .08, bgcolor: "rgba(0,0,0,0)" },
        rangeselector: { x: 0, y: -.42, bgcolor: v("--bg"), activecolor: v("--hair"), font: { size: 10, color: v("--ink") },
          buttons: [{ step: "year", count: 5, label: "5 años" }, { step: "year", count: 15, label: "15 años" }, { step: "all", label: "Todo" }] } }),
      yaxis: ax("Caudal medio mensual (m³/s)", { rangemode: "tozero" }),
      shapes: [{ type: "rect", xref: "x", yref: "paper", x0: "1981-01", x1: "2010-12", y0: 0, y1: 1, fillcolor: v("--grid"), opacity: .45,
        line: { width: 0 }, layer: "below" }] }), CFG);
  },
  s_prod(el) {
    const d = D.prod, col = { "CHIRPS": v("--s3"), "ERA5-Land": v("--s1"), "ERA5": v("--s2") };
    const tr = ["CHIRPS", "ERA5-Land", "ERA5"].map(k => ({ type: "scatter", mode: "lines+markers", name: k, x: d.anos, y: d[k],
      line: { color: col[k], width: 2 }, marker: { size: 5, color: col[k] }, hovertemplate: `${k} %{x}: %{y:,.0f} mm<extra></extra>` }));
    tr.push({ type: "scatter", mode: "lines", name: "IDEAM 1981–2010", x: [1981, 2025], y: [d.ideam, d.ideam],
      line: { color: v("--ink"), width: 1.3, dash: "dot" }, hovertemplate: `IDEAM (kriging): ${d.ideam} mm<extra></extra>` });
    Plotly.react(el, tr, lay({ showlegend: true, hovermode: "x unified", xaxis: ax(""), yaxis: ax("Precipitación anual de la cuenca (mm)", { rangemode: "tozero" }),
      shapes: [{ type: "rect", xref: "x", yref: "paper", x0: 1980.5, x1: 2010.5, y0: 0, y1: 1, fillcolor: v("--grid"), opacity: .5, line: { width: 0 }, layer: "below" }] }), CFG);
  },
  s_p12(el) {
    const d = D.p12, prods = ["IDEAM", "CHIRPS", "ERA5-Land", "ERA5"], col = ["#52514e", "#2a78d6", "#eb6834", "#1baf7a"];
    const tr = prods.map((p, i) => ({ type: "bar", name: p, x: d.est, y: d[p], marker: { color: col[i] },
      hovertemplate: `${p} · %{x}: Q est / Q obs = %{y:.2f} (error %{customdata:+.0f} %)<extra></extra>`, customdata: d[p].map(r => 100 * (r - 1)) }));
    Plotly.react(el, tr, lay({ showlegend: true, barmode: "group", bargap: .25, bargroupgap: .08,
      xaxis: ax("", { tickangle: -30 }), yaxis: ax("Q estimado / Q observado", { type: "log", tickvals: [0.5, 0.8, 1, 1.25, 2, 3, 5, 8], range: [Math.log10(0.6), Math.log10(9)] }),
      shapes: [{ type: "rect", xref: "paper", x0: 0, x1: 1, y0: 0.9, y1: 1.1, fillcolor: v("--grid"), opacity: .7, line: { width: 0 }, layer: "below" },
               { type: "line", xref: "paper", x0: 0, x1: 1, y0: 1, y1: 1, line: { color: v("--ink"), width: 1 } }] }), CFG);
  },
  s_p13(el) {
    const d = D.p13, col = ["#eb6834", "#1baf7a", "#4a3aa7"], mk = ["circle", "square", "triangle-up"];
    const tr = [{ type: "bar", name: "Cuenca completa (P̄m)", x: MESES, y: d.cuenca,
      marker: { color: d.humedo.map(h => h ? "#86b6ef" : v("--grid")), line: { color: v("--axis"), width: 1 } },
      text: d.cuenca.map(x => x.toFixed(0)), textposition: "outside", textfont: { size: 10, color: v("--muted") },
      hovertemplate: "Cuenca · %{x}: %{y:.0f} mm<extra></extra>" }];
    Object.keys(d.reg).forEach((n, i) => tr.push({ type: "scatter", mode: "lines+markers", name: n, x: MESES, y: d.reg[n],
      line: { color: col[i], width: 2 }, marker: { symbol: mk[i], size: 8, color: col[i], line: { color: v("--bg"), width: 1.5 } },
      hovertemplate: `${n.split(" (")[0]} · %{x}: %{y:.0f} mm<extra></extra>` }));
    Plotly.react(el, tr, lay({ showlegend: true, bargap: .35, xaxis: ax(""), yaxis: ax("Precipitación media mensual (mm)", { range: [0, 330] }),
      shapes: [{ type: "line", xref: "paper", x0: 0, x1: 1, y0: d.media, y1: d.media, line: { color: v("--ink"), width: 1, dash: "dot" } }] }), CFG);
  },
  s_p14(el) {
    const d = D.p14, prods = ["IDEAM", "CHIRPS", "ERA5-Land", "ERA5"], col = [v("--ink"), "#2a78d6", "#eb6834", "#1baf7a"];
    const tot = p => d[p].reduce((a, b) => a + b, 0);
    const abs = prods.map((p, i) => ({ type: "scatter", mode: "lines+markers", name: p, x: MESES, y: d[p],
      line: { color: col[i], width: p === "IDEAM" ? 2.6 : 1.8 }, marker: { size: 7, color: col[i], line: { color: v("--bg"), width: 1.5 } },
      customdata: d[p].map(x => 100 * x / tot(p)), hovertemplate: `${p} · %{x}: %{y:.0f} mm (%{customdata:.1f} % del año)<extra></extra>` }));
    const L = lay({ showlegend: true, margin: { l: 56, r: 12, t: 48, b: 36 }, xaxis: ax(""), yaxis: ax("Precipitación media mensual (mm)", { rangemode: "tozero" }) });
    L.updatemenus = [{ type: "buttons", direction: "right", x: 1, xanchor: "right", y: 1.16, yanchor: "top", bgcolor: v("--bg"),
      bordercolor: v("--hair"), font: { size: 11, color: v("--ink") }, active: 0, buttons: [
        { label: "Magnitud (mm)", method: "update", args: [{ visible: [true, true, true, true, false, false, false, false] },
          { "yaxis.title.text": "Precipitación media mensual (mm)", "yaxis.rangemode": "tozero" }] },
        { label: "Normalizado (% del año)", method: "update", args: [{ visible: [false, false, false, false, true, true, true, true] },
          { "yaxis.title.text": "% del total anual", "yaxis.rangemode": "normal" }] }] }];
    Plotly.react(el, abs, L, CFG);
  },
  s_pyea(el) {
    const d = D.pywr;
    const tipo = a => d.nino.includes(a) ? "El Niño" : (d.nina.includes(a) ? "La Niña" : "");
    const col8 = d.anos.map(a => tipo(a) === "El Niño" ? "#d7301f" : (tipo(a) === "La Niña" ? "#2a78d6" : "#9e9e9e"));
    const tr = [
      { type: "bar", name: "8 unidades (2400 MW)", x: d.anos, y: d.e8, marker: { color: col8 }, customdata: d.anos.map(tipo),
        hovertemplate: "%{x} · 8 unidades: %{y:,.0f} GWh %{customdata}<extra></extra>" },
      { type: "scatter", mode: "lines+markers", name: "4 unidades (1200 MW)", x: d.anos, y: d.e4, line: { color: "#eb6834", width: 2 },
        marker: { size: 5, color: "#eb6834" }, hovertemplate: "%{x} · 4 unidades: %{y:,.0f} GWh<extra></extra>" }];
    Plotly.react(el, tr, lay({ showlegend: true, bargap: .25, xaxis: ax(""), yaxis: ax("Energía anual (GWh)", { rangemode: "tozero" }),
      shapes: [{ type: "line", xref: "paper", x0: 0, x1: 1, y0: d.diseno, y1: d.diseno, line: { color: v("--ink"), width: 1.2, dash: "dot" } }],
      margin: { l: 56, r: 12, t: 40, b: 36 },
      annotations: [{ xref: "paper", yref: "paper", x: 1, y: 1.02, xanchor: "right", yanchor: "bottom", showarrow: false,
        text: "línea punteada: energía media de diseño ≈ 13 900 GWh/año", font: { size: 10, color: v("--muted") } }] }), CFG);
  },
  s_pyclima(el) {
    const d = D.pyclima;
    const tr = [
      { type: "scatter", mode: "lines+markers", name: "Energía media", x: d.x, y: d.media, line: { color: "#2a78d6", width: 2.4 },
        hovertemplate: "Aportes %{x:+d} %: %{y:,.0f} GWh/año (media)<extra></extra>" },
      { type: "scatter", mode: "lines+markers", name: "Energía firme (95 %)", x: d.x, y: d.firme, line: { color: "#d7301f", width: 2.4 },
        hovertemplate: "Aportes %{x:+d} %: %{y:,.0f} GWh/año (firme)<extra></extra>" }];
    Plotly.react(el, tr, lay({ showlegend: true, xaxis: ax("Cambio en los aportes (%)", { ticksuffix: " %", dtick: 10 }),
      yaxis: ax("Energía (GWh/año)", { rangemode: "tozero" }) }), CFG);
  },
  s_pyqmin(el) {
    const d = D.pyqmin;
    const tr = [
      { type: "scatter", mode: "lines+markers", name: "Energía media", x: d.x, y: d.media, line: { color: "#2a78d6", width: 2.4 },
        hovertemplate: "Qmín %{x} m³/s: %{y:,.0f} GWh/año (media)<extra></extra>" },

      for (let k = 0; k <= 180; k++) { const a = Math.PI * k / 180, x = 1 + rc * Math.cos(a), y = rc * Math.sin(a), r = Math.hypot(x, y), q = Math.atan2(y, x) * 180 / Math.PI;

      tr.push({ type: "scatterpolar", mode: "lines", r: rr, theta: th, line: { color: v("--axis"), width: .8, dash: "dash" }, hoverinfo: "skip", showlegend: false });

  s_cv(el) {

  s_p12bar(el) {
    const d = D.p12bar;
    const tr = [["P", "P (lluvia)", "#86b6ef"], ["ETR", "ETR (Budyko)", "#1baf7a"], ["R", "Q estimado = P − ETR", "#0b6872"]].map(([k, n, c]) => ({
      type: "bar", name: n, x: d.prod, y: d[k], marker: { color: c }, hovertemplate: `${n} · %{x}: %{y:,.0f} mm/año<extra></extra>` }));
    Plotly.react(el, tr, lay({ showlegend: true, barmode: "group", bargap: .3, xaxis: ax(""),

  s_bud(el) {
    const d = D.p12bud, col = { "IDEAM": "#52514e", "CHIRPS": "#2a78d6", "ERA5-Land": "#eb6834", "ERA5": "#1baf7a" };
    const f = Array.from({ length: 100 }, (_, i) => 0.05 + i * 0.02);
    const tr = [{ type: "scatter", mode: "lines", name: "Budyko (1974)", x: f, y: f.map(p => Math.sqrt(p * Math.tanh(1 / p) * (1 - Math.exp(-p)))),

      hovertemplate: `<b>${p}</b> · %{customdata[0]}<br>φ = %{x:.2f} · ETR obs/P = %{y:.2f}<br>corrección de P necesaria: %{customdata[1]:+.0f} %<extra></extra>` }));
    Plotly.react(el, tr, lay({ showlegend: true, xaxis: ax("Índice de aridez φ = ETP / P", { range: [0, 1.2] }),

        args: ["visible", ks.map((_, j) => j === i).concat([true])] })) }];

  s_bal(el) {
    const b = D.bal, m = 1250;
    Plotly.react(el, [
      { type: "scatter", mode: "lines", x: [0, m, m, 0], y: [0, m * 1.1, m * .9, 0], fill: "toself", fillcolor: v("--grid"),
        line: { width: 0 }, hoverinfo: "skip" },

const hechos = new Set();
function dibujar(pane, forzar) {
  if (typeof Plotly === "undefined") {
    pane.querySelectorAll(".plot").forEach(el => { el.className = "aviso"; el.textContent = "Las figuras necesitan conexión a internet para cargar la librería Plotly."; });
    return;
  }
  pane.querySelectorAll(".plot").forEach(el => {
    if (PLOTS[el.id] && (forzar || !hechos.has(el.id))) { PLOTS[el.id](el); hechos.add(el.id); }
  });
}
const tabs = [...document.querySelectorAll('nav [role="tab"]')];
function mostrar(id, push) {
  const t = tabs.find(b => b.getAttribute("aria-controls") === id) || tabs[0];
  tabs.forEach(b => { const on = b === t; b.setAttribute("aria-selected", on); b.tabIndex = on ? 0 : -1;
    document.getElementById(b.getAttribute("aria-controls")).hidden = !on; });
  const pane = document.getElementById(t.getAttribute("aria-controls"));
  dibujar(pane);
  if (push) { history.replaceState(null, "", "#" + pane.id); window.scrollTo({ top: 0 }); }
  try { localStorage.setItem("tab", pane.id); } catch (e) {}
  t.scrollIntoView({ block: "nearest", inline: "nearest" });
}
tabs.forEach((b, i) => {
  b.addEventListener("click", () => mostrar(b.getAttribute("aria-controls"), true));
  b.addEventListener("keydown", e => {
    const k = { ArrowRight: 1, ArrowLeft: -1 }[e.key];
    if (k) { const n = tabs[(i + k + tabs.length) % tabs.length]; n.focus(); mostrar(n.getAttribute("aria-controls"), true); }
  });
});
let ini = location.hash.slice(1);
if (!ini) { try { ini = localStorage.getItem("tab") || ""; } catch (e) {} }
mostrar(ini || "p1", false);
window.addEventListener("hashchange", () => mostrar(location.hash.slice(1), false));
const lb = document.getElementById("lb"), lbi = document.getElementById("lbi");
document.addEventListener("click", e => { const z = e.target.closest(".zoom"); if (z) { lbi.src = z.dataset.src; lbi.alt = z.getAttribute("aria-label"); lb.showModal(); } });
document.getElementById("lbc").addEventListener("click", () => lb.close());
lb.addEventListener("click", e => { if (e.target === lb) lb.close(); });
const redibujar = () => document.querySelectorAll('[role="tabpanel"]:not([hidden])').forEach(p => dibujar(p, true));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", redibujar);
new MutationObserver(redibujar).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
</script>
